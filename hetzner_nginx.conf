flowchart LR
A[Gate Pass Screen] --> B[Create Pass]
B --> C[POST gate passes]
C --> D{Auth + Role + Validation}
D -- fail --> E[400 or 403 + inline error]
E --> B
D -- ok --> F[Insert GatePass pending]
F --> G[Notify Warden Queue]
G --> H[Review Panel]
H --> I{Approve or Reject}
I -- Approve --> J[status approved]
I -- Reject --> K[status rejected]
J --> L[Security Scan Out]
L --> M[status out + GateScan]
M --> N[Security Scan In]
N --> O[status completed + late calc]
K --> P[Student sees rejected reason]
O --> Q[Timeline, notification, cache invalidation]upstream daphne_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20m;

    location /static/ {
        alias /opt/CC_V1/backend_django/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /opt/CC_V1/backend_django/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /ws/ {
        proxy_pass http://daphne_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://daphne_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
